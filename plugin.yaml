version: 0.1
lint:
  ignore:
    - linters: [ALL]
      paths:
        - .github/copilot-instructions.md
        - .github/docs/**
        - .github/instructions/**
        - .github/prompts/**
        - .github/parked-sessions/**
        - .github/issue-drafts/**
        - .github/plans/**
        - .github/*.md
        - .opencode/AGENTS.md
        - AGENTS.md
    - linters: [stylua]
      paths:
        - "**/locale/*"
  enabled:
    - dotenv-linter@4.0.0
    - actionlint@1.7.12
    - bandit@1.9.4
    - black@26.5.1
    - checkov@3.3.8
    - git-diff-check
    - isort@8.0.1
    - markdownlint@0.49.0
    - osv-scanner@2.4.0
    - oxipng@10.1.1
    - pinact@4.1.0
    - prettier@3.9.5
    - ruff@0.15.21
    - shellcheck@0.11.0
    - shfmt@3.6.0
    - stylua@2.5.2
    - taplo@0.10.0
    - trufflehog@3.95.9
    - yamllint@1.38.0
  exported_configs:
    - configs:
        - configs/.markdownlint.yaml
        - configs/.yamllint.yaml
        - configs/stylua.toml
        - configs/ruff.toml
        - configs/.isort.cfg
actions:
  definitions:
    - id: organize-translations
      triggers:
        - git_hooks: [pre-commit]
      run: uv run --with defusedxml --no-project .trunk/plugins/wbt-configs/scripts/organize_translations/organize_translations.py
runtimes:
  enabled:
    - go@1.25.0
    - node@24.18.0
    - python@3.14.4
